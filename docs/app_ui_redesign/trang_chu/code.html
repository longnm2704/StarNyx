<script>
  (function initHabitOLEDGrid() {
    const gridContainer = document.getElementById('dotMatrixContainer');
    if (!gridContainer) return;

    // Exactly 365 dots (20 rows x 18 = 360, + 1 final row with 5 = 365 total)
    const TOTAL_DOTS = 365;

    // 11 active/lit-up days corresponding to '11 ngày đã thắp' at the most recent days in sequence
    // Indices 354 to 364 (11 dots)
    const LIT_INDICES = new Set([
      354, 355, 356, 357, 358, 359, 360, 361, 362, 363, 364
    ]);

    // Plant/sprout glyph SVG for active lit nodes
    const plantGlyph = `
      <svg class="w-2 h-2 text-on-tertiary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 20V12"/>
        <path d="M12 12C12 8 8 6 6 10C6 14 12 14 12 14"/>
        <path d="M12 12C12 8 16 6 18 10C18 14 12 14 12 14"/>
      </svg>
    `;

    const fragment = document.createDocumentFragment();

    for (let i = 0; i < TOTAL_DOTS; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-3 h-3 flex items-center justify-center rounded-full transition-all duration-300 cursor-pointer select-none';

      if (LIT_INDICES.has(i)) {
        // Glowing Amber Habit Node (#ffb95f) with sprout icon
        dot.className += ' bg-tertiary text-on-tertiary shadow-[0_0_8px_rgba(255,185,95,0.85)] scale-110';
        dot.innerHTML = plantGlyph;
        dot.setAttribute('title', 'Đã hoàn thành');
      } else {
        // Dormant nocturnal OLED node (~12px diameter, bg-surface-container-highest/40 with 3px inner dot)
        dot.className += ' bg-surface-container-highest/40 hover:bg-surface-container-highest/70';
        const innerPoint = document.createElement('div');
        innerPoint.className = 'w-[3px] h-[3px] rounded-full bg-outline-variant/40';
        dot.appendChild(innerPoint);
      }

      // Micro tap interactive on individual dot
      dot.addEventListener('click', function(e) {
        e.stopPropagation();
        const isLit = dot.classList.contains('bg-tertiary');
        if (isLit) {
          dot.className = 'w-3 h-3 flex items-center justify-center rounded-full transition-all duration-300 bg-surface-container-highest/40 hover:bg-surface-container-highest/70';
          dot.innerHTML = '<div class="w-[3px] h-[3px] rounded-full bg-outline-variant/40"></div>';
          dot.removeAttribute('title');
          showToast('Đã huỷ đánh dấu ngày này');
        } else {
          dot.className = 'w-3 h-3 flex items-center justify-center rounded-full transition-all duration-300 bg-tertiary text-on-tertiary shadow-[0_0_8px_rgba(255,185,95,0.85)] scale-110';
          dot.innerHTML = plantGlyph;
          dot.setAttribute('title', 'Đã hoàn thành');
          showToast('Đã thắp thêm 1 ngày ngủ sớm!');
        }
      });

      fragment.appendChild(dot);
    }

    gridContainer.appendChild(fragment);

    // Hero Button Toggle Interaction
    const habitToggle = document.getElementById('habitStateToggle');
    const buttonSubText = document.getElementById('buttonSubText');
    const buttonGlow = document.getElementById('buttonGlow');
    let isCompletedToday = true;

    habitToggle?.addEventListener('click', function () {
      isCompletedToday = !isCompletedToday;
      if (isCompletedToday) {
        buttonGlow.classList.remove('opacity-0');
        buttonGlow.classList.add('opacity-100');
        buttonSubText.className = 'relative font-label-sm text-label-sm text-tertiary flex items-center gap-1.5 mt-0.5 font-medium tracking-wide';
        buttonSubText.innerHTML = `
          <svg class="w-3.5 h-3.5 inline text-tertiary" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22C12 22 12 14 12 14C12 10 7 8 6 12C6 16 12 16 12 16M12 14C12 10 17 8 18 12C18 16 12 16 12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Đã thắp hôm nay.
        `;
        showToast('Đã lưu nghi thức: Đi ngủ đúng giờ 🌙');
      } else {
        buttonGlow.classList.add('opacity-0');
        buttonGlow.classList.remove('opacity-100');
        buttonSubText.className = 'relative font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1 mt-0.5 font-normal';
        buttonSubText.innerHTML = `
          <span class="material-symbols-outlined text-[14px]">bedtime</span>
          Chưa thắp • Nhấn để hoàn thành
        `;
        showToast('Đã bỏ tích hoàn thành cho hôm nay');
      }
    });

    // Simple toast helper
    function showToast(text) {
      const toast = document.getElementById('toastFeedback');
      const msg = document.getElementById('toastMsg');
      if (!toast || !msg) return;
      msg.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100', '-translate-y-2');
      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100', '-translate-y-2');
      }, 2200);
    }

    // Today nav quick click
    document.getElementById('todayNavBtn')?.addEventListener('click', function() {
      showToast('Đang ở ngày hiện tại: Hôm nay');
    });

    // Drawer prompt feedback
    document.getElementById('drawerPrompt')?.addEventListener('click', function() {
      showToast('Mở công cụ phân tích & hẹn giờ ngủ...');
    });
  })();
